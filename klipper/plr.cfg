# moonraker-plr: Klipper side.  [include plr.cfg] in printer.cfg.
#
#   PLR_SAVE Z=<z>        call from the slicer on every layer change
#   PLR_HOLD_BED          bed back to the interrupted print's temperature
#                         (run by the Moonraker component after a reconnect)
#   RESUME_INTERRUPTED    resume from the last saved layer
#   _PLR_CLEAR            forget the saved point
#
# Note: '{' and '}' delimit expressions in Klipper macros, so an empty dict can't
# be written as VALUE="{}". A cleared point is stored as '' instead; every reader
# goes through |default, so both an empty string and a missing variable mean "none".
#
# Copyright (C) 2026 JansenDevelopment
# SPDX-License-Identifier: GPL-3.0-or-later

[respond]

[save_variables]
filename: ~/printer_data/config/variables.cfg

# ---- machine specific: override these in printer.cfg ---------------------
# Purge line drawn while resuming. Put it OUTSIDE the print area and move it
# only along X, so the nozzle never travels over the part.
[gcode_macro _PLR_SETTINGS]
variable_purge_y: 228
variable_purge_x_start: 10
variable_purge_x_end: 200
variable_purge_e: 15
# minutes the bed is kept warm while waiting for a decision
variable_hold_minutes: 120
# Klipper's idle_timeout to restore afterwards (seconds)
variable_idle_timeout: 600
gcode:

[gcode_macro PLR_SAVE]
description: Save a resume point (call from the slicer on every layer change)
gcode:
  {% if printer.virtual_sdcard.is_active %}
    {% set d = {
      'file': printer.print_stats.filename,
      'pos': printer.virtual_sdcard.file_position,
      'z': params.Z|default(printer.gcode_move.gcode_position.z)|float,
      'e': printer.gcode_move.gcode_position.e,
      'extruder': printer.extruder.target,
      'bed': printer.heater_bed.target,
      'fan': printer.fan.speed } %}
    SAVE_VARIABLE VARIABLE=plr VALUE="{d}"
  {% endif %}

[gcode_macro _PLR_CLEAR]
description: Forget the resume point
gcode:
  {% set s = printer["gcode_macro _PLR_SETTINGS"] %}
  SAVE_VARIABLE VARIABLE=plr VALUE="''"
  SET_IDLE_TIMEOUT TIMEOUT={s.idle_timeout}
  {% if not printer.virtual_sdcard.is_active %}
    M140 S0
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"

# Bed only: the nozzle is still sitting on the part and would melt a blob into it.
[gcode_macro PLR_HOLD_BED]
description: Keep the bed at the interrupted print's temperature
gcode:
  {% set s = printer["gcode_macro _PLR_SETTINGS"] %}
  {% set p = printer.save_variables.variables.plr|default({}) %}
  {% if p.file|default('') and p.bed|default(0) > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={s.hold_minutes * 60}
    M140 S{p.bed}
    RESPOND MSG="Bed held at {p.bed} C until resumed or forgotten (max {s.hold_minutes} min)."
  {% endif %}

# After every (firmware) restart: offer to resume if a print was interrupted.
[delayed_gcode PLR_CHECK]
initial_duration: 3
gcode:
  {% set p = printer.save_variables.variables.plr|default({}) %}
  {% if p.file|default('') %}
    RESPOND TYPE=command MSG="action:prompt_begin Interrupted print"
    RESPOND TYPE=command MSG="action:prompt_text {p.file}"
    RESPOND TYPE=command MSG="action:prompt_text Stopped at z = {'%.2f'|format(p.z)} mm. Is the part still stuck, and is the blob under the nozzle cut off?"
    RESPOND TYPE=command MSG="action:prompt_footer_button Resume|RESUME_INTERRUPTED|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Forget|_PLR_CLEAR|error"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro RESUME_INTERRUPTED]
description: Resume an interrupted print from the last saved layer
gcode:
  {% set s = printer["gcode_macro _PLR_SETTINGS"] %}
  {% set p = printer.save_variables.variables.plr|default({}) %}
  {% if not p.file|default('') %}
    RESPOND TYPE=error MSG="No interrupted print found."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_IDLE_TIMEOUT TIMEOUT={s.idle_timeout}
    RESPOND MSG="Resuming {p.file} from z={p.z} (byte {p.pos})"
    M140 S{p.bed}
    M104 S150
    G28
    M190 S{p.bed}
    M109 S{p.extruder}
    G90
    M82
    # purge outside the print area, along X only
    G1 Z10 F600
    G1 X{s.purge_x_start} Y{s.purge_y} F6000
    G1 Z0.3 F600
    G92 E0
    G1 X{s.purge_x_end} E{s.purge_e} F1500
    # up above the part first, only then may the G-code travel over it
    G1 Z{p.z + 2} F600
    G92 E{p.e}
    M106 S{(p.fan * 255)|int}
    G1 Z{p.z} F600
    M23 {p.file}
    M26 S{p.pos}
    M24
  {% endif %}
